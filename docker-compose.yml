services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    volumes:
      # Persist the SQLite database (server/instance/art.db) across restarts
      - db-data:/app/instance
    restart: unless-stopped

  client:
    build: ./client/artwork-app
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db-data:
