# Render Blueprint: creates the Flask API and its Postgres database in one go.
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: horizon-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    region: frankfurt        # closest Render region to Kenya
    plan: free               # switch to "starter" before taking real orders (free sleeps when idle)
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: horizon-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true  # Render creates a strong random key
      - key: FRONTEND_URL
        sync: false          # you'll be asked for it, e.g. https://horizon-gallery.vercel.app

databases:
  - name: horizon-db
    region: frankfurt
    plan: free               # free databases expire, upgrade for real use
